<!DOCTYPE html>
<html>
<head>
    <title>Admin Products - Online Grocery Store</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f5f7fa;
        }

        .navbar {
            background-color: #198754;
        }

        .main-card {
            border: none;
            border-radius: 15px;
        }

        .product-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .form-card {
            border: none;
            border-radius: 15px;
        }

        table {
            vertical-align: middle !important;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/admin">
            🛒 Grocery Store Admin
        </a>

        <div>
            <a href="/admin"
               class="btn btn-light btn-sm me-2">
                📊 Dashboard
            </a>

            <button class="btn btn-danger btn-sm"
                    onclick="logout()">
                🚪 Logout
            </button>
        </div>

    </div>
</nav>


<div class="container mt-5 mb-5">

    <div class="text-center mb-4">
        <h1>📦 Product Management</h1>
        <p class="text-muted">
            Add, edit and delete grocery products
        </p>
    </div>


    <!-- ADD / EDIT PRODUCT FORM -->

    <div class="card form-card shadow mb-5">

        <div class="card-body p-4">

            <h4 id="formTitle">
                ➕ Add Product
            </h4>

            <hr>

            <input type="hidden"
                   id="productId">

            <div class="row g-3">

                <div class="col-md-6">

                    <label class="form-label">
                        Product Name
                    </label>

                    <input type="text"
                           id="productName"
                           class="form-control"
                           placeholder="Example: Apple">

                </div>


                <div class="col-md-3">

                    <label class="form-label">
                        Price
                    </label>

                    <input type="number"
                           id="productPrice"
                           class="form-control"
                           placeholder="120"
                           min="0"
                           step="0.01">

                </div>


                <div class="col-md-3">

                    <label class="form-label">
                        Stock
                    </label>

                    <input type="number"
                           id="productStock"
                           class="form-control"
                           placeholder="50"
                           min="0">

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Description
                    </label>

                    <input type="text"
                           id="productDescription"
                           class="form-control"
                           placeholder="Fresh red apples">

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Image URL
                    </label>

                    <input type="text"
                           id="productImage"
                           class="form-control"
                           placeholder="apple.jpg">

                </div>


                <div class="col-12 mt-4">

                    <button class="btn btn-success"
                            onclick="saveProduct()">

                        💾 Save Product

                    </button>

                    <button id="cancelButton"
                            class="btn btn-secondary ms-2"
                            onclick="cancelEdit()"
                            style="display:none;">

                        ❌ Cancel Edit

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- PRODUCT LIST -->

    <div class="card main-card shadow">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h4 class="mb-0">
                    📋 Product List
                </h4>

                <button class="btn btn-outline-success btn-sm"
                        onclick="loadProducts()">

                    🔄 Refresh

                </button>

            </div>

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead class="table-success">

                    <tr>

                        <th>ID</th>

                        <th>Image</th>

                        <th>Name</th>

                        <th>Description</th>

                        <th>Price</th>

                        <th>Stock</th>

                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody id="productTable">

                    <tr>

                        <td colspan="7"
                            class="text-center">

                            Loading products...

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const loggedInAdmin =
    localStorage.getItem("loggedInAdmin");


/* =========================
   ADMIN SECURITY CHECK
========================= */

if (!loggedInAdmin) {

    alert("Please login as admin first!");

    window.location.href =
        "/admin-login";
}


/* =========================
   LOAD PRODUCTS
========================= */

function loadProducts() {

    fetch("/api/products")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Unable to load products"
                );
            }

            return response.json();
        })

        .then(products => {

            const table =
                document.getElementById(
                    "productTable"
                );

            table.innerHTML = "";


            if (products.length === 0) {

                table.innerHTML = `

                    <tr>

                        <td colspan="7"
                            class="text-center">

                            No products available.

                        </td>

                    </tr>

                `;

                return;
            }


            products.forEach(product => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${product.id}
                    </td>

                    <td>

                        <img
                            src="${getProductImage(product)}"
                            class="product-image"
                            onerror="this.src='https://via.placeholder.com/60?text=Product'"
                            alt="${product.name}">

                    </td>

                    <td>
                        <strong>
                            ${product.name}
                        </strong>
                    </td>

                    <td>
                        ${product.description || ""}
                    </td>

                    <td>
                        ₹${Number(product.price).toFixed(2)}
                    </td>

                    <td>

                        <span class="
                            badge
                            ${product.stock > 0
                            ? 'bg-success'
                            : 'bg-danger'}">

                            ${product.stock}

                        </span>

                    </td>

                    <td>

                        <button
                            class="btn btn-warning btn-sm me-1"
                            onclick="editProduct(${product.id})">

                            ✏️ Edit

                        </button>

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="deleteProduct(${product.id})">

                            🗑️ Delete

                        </button>

                    </td>

                `;


                table.appendChild(row);

            });

        })

        .catch(error => {

            console.error(error);

            document.getElementById(
                "productTable"
            ).innerHTML = `

                <tr>

                    <td colspan="7"
                        class="text-center text-danger">

                        Unable to load products.

                    </td>

                </tr>

            `;

        });

}


/* =========================
   PRODUCT IMAGE
========================= */

function getProductImage(product) {

    const name =
        product.name.toLowerCase();


    if (name.includes("apple")) {

        return "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=200&q=80";

    }


    if (name.includes("tomato")) {

        return "https://images.unsplash.com/photo-1546094096-0df4bcaaa337?auto=format&fit=crop&w=200&q=80";

    }


    if (name.includes("milk")) {

        return "https://images.unsplash.com/photo-1563636619-e9143da7973b?auto=format&fit=crop&w=200&q=80";

    }


    if (name.includes("biscuit")) {

        return "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=200&q=80";

    }


    if (name.includes("orange")) {

        return "https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=200&q=80";

    }


    if (name.includes("banana")) {

        return "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=200&q=80";

    }


    if (product.imageUrl &&
        product.imageUrl.startsWith("http")) {

        return product.imageUrl;
    }


    return "https://via.placeholder.com/60?text=Product";
}


/* =========================
   SAVE PRODUCT
========================= */

function saveProduct() {

    const id =
        document.getElementById(
            "productId"
        ).value;


    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const price =
        document.getElementById(
            "productPrice"
        ).value;


    const stock =
        document.getElementById(
            "productStock"
        ).value;


    const description =
        document.getElementById(
            "productDescription"
        ).value.trim();


    const imageUrl =
        document.getElementById(
            "productImage"
        ).value.trim();


    if (name === "") {

        alert("Please enter product name.");

        return;
    }


    if (price === "" ||
        Number(price) < 0) {

        alert("Please enter valid price.");

        return;
    }


    if (stock === "" ||
        Number(stock) < 0) {

        alert("Please enter valid stock.");

        return;
    }


    const product = {

        name: name,

        price: Number(price),

        description: description,

        stock: Number(stock),

        imageUrl: imageUrl

    };


    let url =
        "/api/products";


    let method =
        "POST";


    if (id !== "") {

        url =
            "/api/products/" + id;

        method =
            "PUT";
    }


    fetch(url, {

        method: method,

        headers: {

            "Content-Type":
                "application/json"

        },

        body:
            JSON.stringify(product)

    })

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Unable to save product"
            );
        }

        return response.json();

    })

    .then(() => {

        if (id === "") {

            alert(
                "Product added successfully!"
            );

        } else {

            alert(
                "Product updated successfully!"
            );
        }


        clearForm();

        loadProducts();

    })

    .catch(error => {

        console.error(error);

        alert(
            "Unable to save product."
        );

    });

}


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(id) {

    fetch(
        "/api/products/" + id
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Product not found"
            );
        }

        return response.json();

    })

    .then(product => {

        document.getElementById(
            "productId"
        ).value =
            product.id;


        document.getElementById(
            "productName"
        ).value =
            product.name;


        document.getElementById(
            "productPrice"
        ).value =
            product.price;


        document.getElementById(
            "productStock"
        ).value =
            product.stock;


        document.getElementById(
            "productDescription"
        ).value =
            product.description || "";


        document.getElementById(
            "productImage"
        ).value =
            product.imageUrl || "";


        document.getElementById(
            "formTitle"
        ).innerText =
            "✏️ Edit Product";


        document.getElementById(
            "cancelButton"
        ).style.display =
            "inline-block";


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    })

    .catch(error => {

        console.error(error);

        alert(
            "Unable to load product."
        );

    });

}


/* =========================
   DELETE PRODUCT
========================= */

function deleteProduct(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmed) {

        return;
    }


    fetch(
        "/api/products/" + id,
        {
            method: "DELETE"
        }
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Unable to delete product"
            );
        }


        alert(
            "Product deleted successfully!"
        );


        loadProducts();

    })

    .catch(error => {

        console.error(error);

        alert(
            "Unable to delete product."
        );

    });

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

    clearForm();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm() {

    document.getElementById(
        "productId"
    ).value = "";


    document.getElementById(
        "productName"
    ).value = "";


    document.getElementById(
        "productPrice"
    ).value = "";


    document.getElementById(
        "productStock"
    ).value = "";


    document.getElementById(
        "productDescription"
    ).value = "";


    document.getElementById(
        "productImage"
    ).value = "";


    document.getElementById(
        "formTitle"
    ).innerText =
        "➕ Add Product";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "none";

}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "loggedInAdmin"
    );


    alert(
        "Admin logged out!"
    );


    window.location.href =
        "/admin-login";

}


/* =========================
   INITIAL LOAD
========================= */

loadProducts();

</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
