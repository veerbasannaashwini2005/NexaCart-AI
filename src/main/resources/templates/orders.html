<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders - Online Grocery Store</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>

        .order-card {
            border-radius: 12px;
        }

        .item-card {
            background: #f8f9fa;
            border-radius: 10px;
        }

        .status-badge {
            font-size: 14px;
        }

    </style>

</head>


<body>

<nav class="navbar navbar-dark bg-success">

    <div class="container">

        <a class="navbar-brand" href="/">
            🛒 Online Grocery Store
        </a>

        <div>

            <a href="/products"
               class="btn btn-light me-2">
                Products
            </a>

            <a href="/cart"
               class="btn btn-warning">
                🛒 Cart
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <h2 class="mb-4">
        📦 My Orders
    </h2>

    <div id="ordersContainer">

        <p>Loading orders...</p>

    </div>

</div>


<script>

// =====================================
// GET LOGGED-IN USER
// =====================================

const storedUser =
    localStorage.getItem("loggedInUser");


if (!storedUser) {

    alert("Please login first!");

    window.location.href =
        "/login";

}


const user =
    JSON.parse(storedUser);

const userId =
    user.id;


// =====================================
// LOAD ORDERS
// =====================================

function loadOrders() {

    fetch(`/api/orders/user/${userId}`)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Unable to load orders"
                );

            }

            return response.json();

        })

        .then(orders => {

            const container =
                document.getElementById(
                    "ordersContainer"
                );

            container.innerHTML = "";


            if (orders.length === 0) {

                container.innerHTML = `

                    <div class="alert alert-info">

                        You have not placed any orders yet.

                    </div>

                    <a href="/products"
                       class="btn btn-success">

                        Start Shopping

                    </a>

                `;

                return;

            }


            // Latest orders first

            orders.reverse();


            // Load each order

            orders.forEach(order => {

                loadOrderItems(
                    order,
                    container
                );

            });

        })

        .catch(error => {

            console.error(error);

            document.getElementById(
                "ordersContainer"
            ).innerHTML = `

                <div class="alert alert-danger">

                    Unable to load orders.

                </div>

            `;

        });

}


// =====================================
// LOAD ORDER ITEMS
// =====================================

function loadOrderItems(
    order,
    container
) {

    fetch(
        `/api/order-items/order/${order.id}`
    )

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Unable to load order items"
                );

            }

            return response.json();

        })

        .then(items => {

            displayOrder(
                order,
                items,
                container
            );

        })

        .catch(error => {

            console.error(error);

            displayOrder(
                order,
                [],
                container
            );

        });

}


// =====================================
// DISPLAY ORDER
// =====================================

function displayOrder(
    order,
    items,
    container
) {

    let statusClass =
        "bg-success";


    if (order.status === "CANCELLED") {

        statusClass =
            "bg-danger";

    }
    else if (order.status === "SHIPPED") {

        statusClass =
            "bg-warning text-dark";

    }
    else if (order.status === "DELIVERED") {

        statusClass =
            "bg-primary";

    }


    let itemsHTML = "";


    if (items.length === 0) {

        itemsHTML = `

            <div class="alert alert-secondary">

                No item details available.

            </div>

        `;

    }
    else {

        items.forEach(item => {

            const itemTotal =
                Number(item.price) *
                Number(item.quantity);


            const productName =
                item.product
                ? item.product.name
                : "Product";


            itemsHTML += `

                <div class="item-card p-3 mb-2">

                    <div class="row align-items-center">

                        <div class="col-md-4">

                            <strong>
                                🛒 ${productName}
                            </strong>

                        </div>


                        <div class="col-md-2">

                            <small class="text-muted">
                                Quantity
                            </small>

                            <br>

                            ${item.quantity}

                        </div>


                        <div class="col-md-2">

                            <small class="text-muted">
                                Price
                            </small>

                            <br>

                            ₹${Number(
                                item.price
                            ).toFixed(2)}

                        </div>


                        <div class="col-md-2">

                            <small class="text-muted">
                                Item Total
                            </small>

                            <br>

                            <strong>
                                ₹${itemTotal.toFixed(2)}
                            </strong>

                        </div>


                        <div class="col-md-2">

                            ${
                                item.product &&
                                item.product.category
                                ? `
                                    <span class="badge bg-secondary">

                                        ${item.product.category.name}

                                    </span>
                                  `
                                : ""
                            }

                        </div>

                    </div>

                </div>

            `;

        });

    }


    let cancelButton = "";


    // Only PLACED orders can be cancelled

    if (order.status === "PLACED") {

        cancelButton = `

            <button
                class="btn btn-danger mt-3"
                onclick="cancelOrder(${order.id})">

                ❌ Cancel Order

            </button>

        `;

    }


    container.innerHTML += `

        <div class="card order-card shadow mb-4">

            <div class="card-header">

                <div class="row align-items-center">

                    <div class="col-md-3">

                        <h5 class="mb-0">

                            📦 Order #${order.id}

                        </h5>

                    </div>


                    <div class="col-md-3">

                        <strong>
                            Total
                        </strong>

                        <br>

                        ₹${Number(
                            order.totalAmount
                        ).toFixed(2)}

                    </div>


                    <div class="col-md-3">

                        <strong>
                            Status
                        </strong>

                        <br>

                        <span
                            class="badge status-badge ${statusClass}">

                            ${order.status}

                        </span>

                    </div>


                    <div class="col-md-3">

                        <strong>
                            Order Date
                        </strong>

                        <br>

                        ${formatDate(
                            order.orderDate
                        )}

                    </div>

                </div>

            </div>


            <div class="card-body">

                <h6 class="mb-3">

                    🛍️ Ordered Items

                </h6>

                ${itemsHTML}

                ${cancelButton}

            </div>

        </div>

    `;

}


// =====================================
// CANCEL ORDER
// =====================================

function cancelOrder(orderId) {

    const confirmed =
        confirm(
            "Are you sure you want to cancel Order #" +
            orderId +
            "?"
        );


    if (!confirmed) {

        return;

    }


    fetch(
        `/api/orders/${orderId}/cancel`,
        {
            method: "PUT"
        }
    )

    .then(async response => {

        const text =
            await response.text();


        if (!response.ok) {

            throw new Error(
                text ||
                "Unable to cancel order"
            );

        }


        return text;

    })

    .then(() => {

        alert(
            "Order #" +
            orderId +
            " cancelled successfully!"
        );

        loadOrders();

    })

    .catch(error => {

        alert(
            "Unable to cancel order: " +
            error.message
        );

    });

}


// =====================================
// DATE FORMAT
// =====================================

function formatDate(dateString) {

    if (!dateString) {

        return "N/A";

    }

    return new Date(
        dateString
    ).toLocaleString();

}


// =====================================
// START
// =====================================

loadOrders();

</script>

</body>

</html>
