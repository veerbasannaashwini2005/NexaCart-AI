<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Orders - Online Grocery Store</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/admin">
            🛒 Grocery Store - Admin
        </a>

        <div>

            <a href="/admin"
               class="btn btn-light btn-sm me-2">
                Dashboard
            </a>

            <a href="/admin-products"
               class="btn btn-warning btn-sm me-2">
                Products
            </a>

            <button
                class="btn btn-danger btn-sm"
                onclick="logoutAdmin()">
                Logout
            </button>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            📦 Manage Orders
        </h2>

        <button
            class="btn btn-primary"
            onclick="loadOrders()">
            🔄 Refresh
        </button>

    </div>


    <div id="message"></div>


    <div id="ordersContainer">

        <div class="text-center">
            <div class="spinner-border text-success"></div>
            <p class="mt-2">
                Loading orders...
            </p>
        </div>

    </div>

</div>


<script>

// ==============================
// ADMIN LOGIN CHECK
// ==============================

const loggedInAdmin =
    localStorage.getItem("loggedInAdmin");

if (!loggedInAdmin) {

    alert("Please login as admin first.");

    window.location.href =
        "/admin-login";
}



// ==============================
// LOGOUT
// ==============================

function logoutAdmin() {

    localStorage.removeItem(
        "loggedInAdmin"
    );

    window.location.href =
        "/admin-login";
}



// ==============================
// LOAD ORDERS
// ==============================

function loadOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );

    container.innerHTML = `

        <div class="text-center">

            <div class="spinner-border text-success">
            </div>

            <p class="mt-2">
                Loading orders...
            </p>

        </div>

    `;


    fetch("/api/orders")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Unable to load orders"
                );

            }

            return response.json();

        })

        .then(orders => {

            container.innerHTML = "";


            if (orders.length === 0) {

                container.innerHTML = `

                    <div class="alert alert-info">

                        No orders found.

                    </div>

                `;

                return;
            }


            // Show latest orders first
            orders.reverse();


            orders.forEach(order => {

                const status =
                    order.status
                    ? order.status.toUpperCase()
                    : "PLACED";


                let badgeClass =
                    "bg-success";


                if (status === "SHIPPED") {

                    badgeClass =
                        "bg-warning text-dark";

                }
                else if (status === "DELIVERED") {

                    badgeClass =
                        "bg-primary";

                }
                else if (status === "CANCELLED") {

                    badgeClass =
                        "bg-danger";

                }


                let customerName =
                    "Customer";


                let customerEmail =
                    "";


                if (order.user) {

                    customerName =
                        order.user.name || "Customer";

                    customerEmail =
                        order.user.email || "";

                }


                let options = `

                    <option value="PLACED"
                        ${status === "PLACED"
                            ? "selected"
                            : ""}>
                        PLACED
                    </option>

                    <option value="SHIPPED"
                        ${status === "SHIPPED"
                            ? "selected"
                            : ""}>
                        SHIPPED
                    </option>

                    <option value="DELIVERED"
                        ${status === "DELIVERED"
                            ? "selected"
                            : ""}>
                        DELIVERED
                    </option>

                    <option value="CANCELLED"
                        ${status === "CANCELLED"
                            ? "selected"
                            : ""}>
                        CANCELLED
                    </option>

                `;


                container.innerHTML += `

                    <div class="card shadow-sm mb-4">

                        <div class="card-header
                                    d-flex
                                    justify-content-between
                                    align-items-center">

                            <strong>
                                Order #${order.id}
                            </strong>

                            <span
                                class="badge ${badgeClass}">

                                ${status}

                            </span>

                        </div>


                        <div class="card-body">

                            <div class="row">

                                <div class="col-md-3">

                                    <strong>
                                        Customer
                                    </strong>

                                    <p class="mb-1">
                                        ${customerName}
                                    </p>

                                    <small class="text-muted">
                                        ${customerEmail}
                                    </small>

                                </div>


                                <div class="col-md-2">

                                    <strong>
                                        Total
                                    </strong>

                                    <p class="text-success fw-bold">

                                        ₹${Number(
                                            order.totalAmount || 0
                                        ).toFixed(2)}

                                    </p>

                                </div>


                                <div class="col-md-3">

                                    <strong>
                                        Order Date
                                    </strong>

                                    <p>

                                        ${formatDate(
                                            order.orderDate
                                        )}

                                    </p>

                                </div>


                                <div class="col-md-4">

                                    <strong>
                                        Update Status
                                    </strong>

                                    <div class="input-group mt-2">

                                        <select
                                            id="status-${order.id}"
                                            class="form-select">

                                            ${options}

                                        </select>

                                        <button
                                            class="btn btn-success"
                                            onclick="updateStatus(${order.id})">

                                            Update

                                        </button>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                `;

            });

        })

        .catch(error => {

            console.error(error);

            container.innerHTML = `

                <div class="alert alert-danger">

                    Unable to load orders.

                    <br>

                    ${error.message}

                </div>

            `;

        });

}



// ==============================
// UPDATE ORDER STATUS
// ==============================

function updateStatus(orderId) {

    const select =
        document.getElementById(
            "status-" + orderId
        );


    const status =
        select.value;


    fetch(
        `/api/orders/${orderId}/status?status=${status}`,
        {
            method: "PUT"
        }
    )

    .then(async response => {

        const text =
            await response.text();


        if (!response.ok) {

            throw new Error(
                text ||
                "Unable to update order status"
            );

        }


        return text;

    })

    .then(() => {

        showMessage(
            `Order #${orderId} updated to ${status}`,
            "success"
        );


        // Reload orders
        loadOrders();

    })

    .catch(error => {

        console.error(error);

        showMessage(
            error.message,
            "danger"
        );

    });

}



// ==============================
// MESSAGE
// ==============================

function showMessage(
    message,
    type
) {

    const box =
        document.getElementById(
            "message"
        );


    box.innerHTML = `

        <div class="alert alert-${type}">

            ${message}

        </div>

    `;


    setTimeout(() => {

        box.innerHTML = "";

    }, 3000);

}



// ==============================
// DATE FORMAT
// ==============================

function formatDate(dateString) {

    if (!dateString) {

        return "N/A";

    }


    const date =
        new Date(dateString);


    return date.toLocaleString();

}


// Load orders
loadOrders();

</script>

</body>

</html>
