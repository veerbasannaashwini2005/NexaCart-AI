<!DOCTYPE html>

<html>

<head>

```
<title>My Cart - Online Grocery Store</title>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>

    .cart-image {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 10px;
    }

    .cart-card {
        transition: 0.3s;
    }

    .cart-card:hover {
        transform: translateY(-2px);
    }

</style>
```

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-success">

```
<div class="container">

    <a class="navbar-brand fw-bold"
       href="/">

        🛒 Online Grocery Store

    </a>


    <div>

        <a href="/products"
           class="btn btn-light me-2">

            Continue Shopping

        </a>

        <a href="/orders"
           class="btn btn-warning">

            📦 Orders

        </a>

    </div>

</div>
```

</nav>

<!-- CART -->

<div class="container mt-5">

```
<h2 class="mb-4">

    🛒 My Shopping Cart

</h2>


<div id="cartContainer">

    <p>
        Loading cart...
    </p>

</div>


<div id="cartTotal"
     class="mt-4">

</div>
```

</div>

<script>


// ========================================
// GET LOGGED-IN USER
// ========================================

const storedUser =
    localStorage.getItem(
        "loggedInUser"
    );


if (!storedUser) {

    alert(
        "Please login first!"
    );

    window.location.href =
        "/login";

}


const user =
    JSON.parse(
        storedUser
    );


const userId =
    user.id;



// ========================================
// PRODUCT IMAGE
// ========================================

function getProductImage(
    productName
) {

    if (productName === "Apple") {

        return "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=300&q=80";

    }

    if (productName === "Tomato") {

        return "https://images.unsplash.com/photo-1546094096-0df4bcaaa337?auto=format&fit=crop&w=300&q=80";

    }

    if (productName === "Milk") {

        return "https://images.unsplash.com/photo-1563636619-e9143da7973b?auto=format&fit=crop&w=300&q=80";

    }

    if (productName === "Biscuits") {

        return "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=300&q=80";

    }

    if (productName === "Orange Juice") {

        return "https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=300&q=80";

    }

    if (productName === "Banana") {

        return "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=300&q=80";

    }

    return "";

}



// ========================================
// LOAD CART
// ========================================

function loadCart() {

    fetch(
        `/api/cart/${userId}`
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Unable to load cart"
            );

        }

        return response.json();

    })

    .then(items => {

        const container =
            document.getElementById(
                "cartContainer"
            );

        const totalContainer =
            document.getElementById(
                "cartTotal"
            );


        container.innerHTML = "";

        totalContainer.innerHTML = "";


        // EMPTY CART

        if (items.length === 0) {

            container.innerHTML = `

                <div class="text-center mt-5">

                    <h1>
                        🛒
                    </h1>

                    <h3>
                        Your cart is empty
                    </h3>

                    <p class="text-muted">
                        Add some groceries to your cart.
                    </p>

                    <a
                        href="/products"
                        class="btn btn-success">

                        🛍️ Start Shopping

                    </a>

                </div>

            `;

            return;

        }


        let total = 0;



        // =================================
        // DISPLAY ITEMS
        // =================================

        items.forEach(item => {

            const itemTotal =
                item.product.price *
                item.quantity;


            total += itemTotal;


            const image =
                getProductImage(
                    item.product.name
                );


            container.innerHTML += `

                <div class="card cart-card shadow mb-3">

                    <div class="card-body">

                        <div class="row align-items-center">


                            <!-- IMAGE -->

                            <div class="col-md-2 text-center">

                                <img
                                    src="${image}"
                                    class="cart-image"
                                    alt="${item.product.name}"
                                >

                            </div>


                            <!-- PRODUCT -->

                            <div class="col-md-2">

                                <h5>
                                    ${item.product.name}
                                </h5>

                                <small class="text-muted">

                                    ${item.product.description}

                                </small>

                            </div>


                            <!-- PRICE -->

                            <div class="col-md-2">

                                <strong>
                                    Price
                                </strong>

                                <br>

                                ₹${item.product.price}

                            </div>


                            <!-- QUANTITY -->

                            <div class="col-md-2">

                                <strong>
                                    Quantity
                                </strong>

                                <div class="input-group mt-2">

                                    <button
                                        class="btn btn-outline-success"
                                        onclick="
                                            decreaseQuantity(
                                                ${item.id},
                                                ${item.quantity}
                                            )
                                        ">

                                        −

                                    </button>


                                    <input
                                        type="text"
                                        value="${item.quantity}"
                                        class="form-control text-center"
                                        readonly
                                    >


                                    <button
                                        class="btn btn-outline-success"
                                        onclick="
                                            increaseQuantity(
                                                ${item.id},
                                                ${item.quantity}
                                            )
                                        ">

                                        +

                                    </button>

                                </div>

                            </div>


                            <!-- ITEM TOTAL -->

                            <div class="col-md-2">

                                <strong>
                                    Total
                                </strong>

                                <br>

                                <span class="text-success fw-bold">

                                    ₹${itemTotal}

                                </span>

                            </div>


                            <!-- REMOVE -->

                            <div class="col-md-2">

                                <button
                                    class="btn btn-danger"
                                    onclick="
                                        removeItem(
                                            ${item.id}
                                        )
                                    ">

                                    🗑️ Remove

                                </button>

                            </div>


                        </div>

                    </div>

                </div>

            `;

        });



        // =================================
        // GRAND TOTAL
        // =================================

        totalContainer.innerHTML = `

            <div class="card shadow p-4">

                <div class="row align-items-center">

                    <div class="col-md-8">

                        <h3>

                            Grand Total:

                            <span class="text-success">

                                ₹${total}

                            </span>

                        </h3>

                    </div>


                    <div class="col-md-4 text-end">

                        <button
                            class="btn btn-success btn-lg"
                            	onclick="goToCheckout()">

                            📦 Checkout

                        </button>

                    </div>

                </div>

            </div>

        `;

    })

    .catch(error => {

        console.error(error);

        document.getElementById(
            "cartContainer"
        ).innerHTML = `

            <div class="alert alert-danger">

                Unable to load cart.

            </div>

        `;

    });

}



// ========================================
// INCREASE QUANTITY
// ========================================

function increaseQuantity(
    cartItemId,
    currentQuantity
) {

    const newQuantity =
        currentQuantity + 1;


    updateQuantity(
        cartItemId,
        newQuantity
    );

}



// ========================================
// DECREASE QUANTITY
// ========================================

function decreaseQuantity(
    cartItemId,
    currentQuantity
) {

    if (currentQuantity <= 1) {

        alert(
            "Quantity cannot be less than 1"
        );

        return;

    }


    const newQuantity =
        currentQuantity - 1;


    updateQuantity(
        cartItemId,
        newQuantity
    );

}



// ========================================
// UPDATE QUANTITY
// ========================================

function updateQuantity(
    cartItemId,
    quantity
) {

    fetch(
        `/api/cart/update/${cartItemId}?quantity=${quantity}`,
        {
            method: "PUT"
        }
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Unable to update quantity"
            );

        }

        return response.json();

    })

    .then(() => {

        loadCart();

    })

    .catch(error => {

        console.error(error);

        alert(
            "Error updating quantity."
        );

    });

}



// ========================================
// REMOVE ITEM
// ========================================

function removeItem(
    cartItemId
) {

    if (
        !confirm(
            "Remove this product from cart?"
        )
    ) {

        return;

    }


    fetch(
        `/api/cart/remove/${cartItemId}`,
        {
            method: "DELETE"
        }
    )

    .then(response =>
        response.text()
    )

    .then(message => {

        alert(message);

        loadCart();

    })

    .catch(error => {

        console.error(error);

        alert(
            "Error removing product."
        );

    });

}



// ========================================
// PLACE ORDER
// ========================================

function placeOrder() {

    if (
        !confirm(
            "Are you sure you want to place this order?"
        )
    ) {

        return;

    }


    fetch(
        `/api/orders/place/${userId}`,
        {
            method: "POST"
        }
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Unable to place order"
            );

        }

        return response.json();

    })

    .then(order => {

        alert(
            "🎉 Order placed successfully!\n\n"
            + "Order ID: "
            + order.id
        );


        window.location.href =
            "/orders";

    })

    .catch(error => {

        console.error(error);

        alert(
            "Error placing order."
        );

    });
    }
function goToCheckout() {
    window.location.href = "/checkout";

}



// ========================================
// START
// ========================================

loadCart();

</script>

</body>

</html>
