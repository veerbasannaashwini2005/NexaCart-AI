<!DOCTYPE html>
<html>
<head>

    <title>Admin Login - Online Grocery Store</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>

        body {

            background: linear-gradient(
                135deg,
                #198754,
                #0d6efd
            );

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .login-card {

            width: 400px;

            border-radius: 15px;

        }


        .admin-icon {

            font-size: 60px;

        }

    </style>

</head>


<body>


<div class="card login-card shadow-lg p-4">


    <div class="text-center">

        <div class="admin-icon">
            👨‍💼
        </div>

        <h2 class="mt-2">
            Admin Login
        </h2>

        <p class="text-muted">
            Online Grocery Store
        </p>

    </div>


    <form id="adminLoginForm">


        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Enter admin email"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter admin password"
                required>

        </div>


        <button
            type="submit"
            class="btn btn-success w-100">

            🔐 Login

        </button>


    </form>


    <div class="text-center mt-3">

        <a href="/">
            ← Back to Home
        </a>

    </div>


</div>


<script>


// ==========================================
// CHECK IF ADMIN IS ALREADY LOGGED IN
// ==========================================

const existingAdmin =
    localStorage.getItem("loggedInAdmin");


if (existingAdmin) {

    window.location.href =
        "/admin";

}


// ==========================================
// ADMIN LOGIN
// ==========================================

document
    .getElementById("adminLoginForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            // Demo admin credentials

            if (
                email === "admin@gmail.com"
                &&
                password === "admin123"
            ) {


                const admin = {

                    email: email,

                    role: "ADMIN"

                };


                localStorage.setItem(
                    "loggedInAdmin",
                    JSON.stringify(admin)
                );


                alert(
                    "Admin login successful!"
                );


                window.location.href =
                    "/admin";


            } else {


                alert(
                    "Invalid admin email or password!"
                );

            }

        }
    );

</script>


</body>
</html>
