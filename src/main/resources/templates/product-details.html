<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - Online Grocery Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 100%;
            height: 350px;
            object-fit: contain;
            border-radius: 12px;
            background: #f1f1f1;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            color: #198754;
        }

        .stock {
            font-weight: bold;
        }

        .quantity-box {
            width: 100px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-success">
    <div class="container">

        <a class="navbar-brand" href="/">
            🛒 Online Grocery Store
        </a>

        <div>
            <a href="/products" class="btn btn-light btn-sm">
                Products
            </a>

            <a href="/cart" class="btn btn-warning btn-sm">
                Cart
            </a>
        </div>

    </div>
</nav>

<div class="container">

    <div class="product-card">

        <div id="loading" class="text-center">
            <h4>Loading product...</h4>
        </div>

        <div id="error" class="alert alert-danger d-none"></div>

        <div id="productContent" class="row d-none">

            <div class="col-md-6">

                <img
                    id="productImage"
                    class="product-image"
                    src=""
                    alt="Product">

            </div>

            <div class="col-md-6">

                <h1 id="productName"></h1>

                <p id="productDescription"
                   class="text-muted">
                </p>

                <div class="price mb-3">
                    ₹<span id="productPrice"></span>
                </div>

                <p>
                    <strong>Available Stock:</strong>
                    <span id="productStock"
                          class="stock">
                    </span>
                </p>

                <hr>

                <label class="form-label">
                    <strong>Quantity</strong>
                </label>

                <input
                    type="number"
                    id="quantity"
                    class="form-control quantity-box mb-3"
                    value="1"
                    min="1">

                <button
                    class="btn btn-success btn-lg"
                    onclick="addToCart()">
                    🛒 Add to Cart
                </button>

                <a
                    href="/products"
                    class="btn btn-secondary btn-lg">
                    Back to Products
                </a>

                <div
                    id="message"
                    class="alert d-none mt-3">
                </div>

            </div>

        </div>

    </div>

</div>

<script>

let product = null;
let user = null;

const productId =
    window.location.pathname.split("/").pop();

function loadProduct() {

    fetch("/api/products/" + productId)

        .then(response => {

            if (!response.ok) {
                throw new Error("Product not found");
            }

            return response.json();
        })

        .then(data => {

            product = data;

            document.getElementById("loading")
                .classList.add("d-none");

            document.getElementById("productContent")
                .classList.remove("d-none");

            document.getElementById("productName")
                .textContent = product.name;

            document.getElementById("productDescription")
                .textContent =
                product.description || "No description available.";

            document.getElementById("productPrice")
                .textContent =
                Number(product.price).toFixed(2);

            document.getElementById("productStock")
                .textContent =
                product.stock;

            const image =
                document.getElementById("productImage");

            if (product.imageUrl) {

                image.src =
                    "/images/" + product.imageUrl;

                image.onerror = function() {
                    this.src =
                        "https://via.placeholder.com/400x300?text="
                        + encodeURIComponent(product.name);
                };

            } else {

                image.src =
                    "https://via.placeholder.com/400x300?text="
                    + encodeURIComponent(product.name);
            }

            const quantityInput =
                document.getElementById("quantity");

            quantityInput.max = product.stock;

            if (product.stock <= 0) {

                quantityInput.disabled = true;

                document.querySelector(
                    "button[onclick='addToCart()']"
                ).disabled = true;
            }

        })

        .catch(error => {

            document.getElementById("loading")
                .classList.add("d-none");

            const errorBox =
                document.getElementById("error");

            errorBox.textContent =
                error.message;

            errorBox.classList.remove("d-none");
        });
}


function addToCart() {

    user =
        JSON.parse(localStorage.getItem("user"));

    if (!user) {

        showMessage(
            "Please login before adding products to cart.",
            "danger"
        );

        setTimeout(() => {
            window.location.href = "/login";
        }, 1500);

        return;
    }

    const quantity =
        Number(
            document.getElementById("quantity").value
        );

    if (!quantity || quantity < 1) {

        showMessage(
            "Please enter a valid quantity.",
            "danger"
        );

        return;
    }

    if (quantity > product.stock) {

        showMessage(
            "Only " + product.stock +
            " items are available.",
            "danger"
        );

        return;
    }

    fetch(
        "/api/cart/add?userId=" +
        user.id +
        "&productId=" +
        product.id +
        "&quantity=" +
        quantity,
        {
            method: "POST"
        }
    )

    .then(async response => {

        const text = await response.text();

        if (!response.ok) {
            throw new Error(
                text || "Failed to add product to cart"
            );
        }

        return text;
    })

    .then(() => {

        showMessage(
            "Product added to cart successfully!",
            "success"
        );

    })

    .catch(error => {

        showMessage(
            error.message,
            "danger"
        );

    });
}


function showMessage(message, type) {

    const box =
        document.getElementById("message");

    box.textContent = message;

    box.className =
        "alert alert-" + type + " mt-3";

}


loadProduct();

</script>

</body>
</html>
